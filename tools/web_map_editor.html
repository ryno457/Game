<title>Biodome 01 Survey</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#080d0f; --panel:#111a1d; --panel2:#162226; --line:#223034;
  --ink:#dfe9e8; --dim:#7c9398; --faint:#4a6066;
  --amber:#e2a24b; --rust:#de5b4e; --magenta:#d25a9e;
  --cyan:#57c9de; --moss:#63c48f; --orange:#e8813c;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
/* The survey instrument is dark in every theme: this page is a view of a
   night-time biodome, and a light version of it would be a different picture,
   not the same picture on a pale ground. Everything is painted explicitly so
   it holds on either host background. */
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);
  overscroll-behavior:none;
}
*{box-sizing:border-box}
#app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---- top bar ---- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--amber)}
.counts{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:2px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.chip b{color:var(--ink);font-weight:500}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.spacer{flex:1 1 auto}
.acts{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:7px 12px;border-radius:2px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
}
.btn:hover{border-color:var(--faint)}
.btn.key{background:var(--amber);border-color:var(--amber);color:#16110a}
.btn.key:hover{background:#eeb268;border-color:#eeb268}
.btn:focus-visible,.tool:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--amber);outline-offset:2px}

/* ---- body: rail + canvas ---- */
#main{display:flex;flex:1 1 auto;min-height:0}
#rail{
  width:132px;flex:0 0 132px;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:6px;
}
.group{font-family:var(--cond);font-size:11px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;padding:9px 6px 3px}
.tool{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 8px;border-radius:2px;background:transparent;border:1px solid transparent;
  border-left:3px solid transparent;color:var(--dim);
}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--panel2);color:var(--ink);border-left-color:var(--amber)}
.tool i{width:9px;height:9px;flex:0 0 9px;border-radius:2px}
.tool .n{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.04em;
  text-transform:uppercase;line-height:1.05}
.tool .d{display:block;font-family:var(--sans);font-size:10.5px;color:var(--faint);
  letter-spacing:0;text-transform:none;font-weight:400}
#stage{flex:1 1 auto;position:relative;min-width:0;background:var(--void)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{
  position:absolute;left:12px;top:12px;max-width:min(360px,70%);
  font-size:12px;line-height:1.45;color:var(--dim);
  background:rgba(8,13,15,.82);border:1px solid var(--line);border-left:3px solid var(--amber);
  padding:8px 11px;border-radius:2px;pointer-events:none;
}
#hint b{color:var(--ink);font-weight:500}
#coord{
  position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:11px;
  color:var(--dim);background:rgba(8,13,15,.82);border:1px solid var(--line);
  padding:5px 9px;border-radius:2px;pointer-events:none;font-variant-numeric:tabular-nums;
}

/* ---- bottom params ---- */
footer{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;
}
.par{display:flex;align-items:center;gap:9px;min-width:190px;flex:1 1 190px}
.par label{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap}
.par output{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:52px;
  text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1 1 auto;min-width:70px;accent-color:var(--amber);background:transparent}

/* ---- sheet ---- */
#sheet[hidden]{display:none!important}
#sheet{
  position:fixed;inset:0;z-index:20;background:rgba(4,8,9,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  width:min(720px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;
}
.card header{background:transparent;border-bottom:1px solid var(--line);padding-top:12px}
.card .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:11px}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--dim);max-width:62ch}
.card p b{color:var(--ink);font-weight:500}
textarea{
  width:100%;min-height:210px;resize:vertical;font-family:var(--mono);font-size:11.5px;
  line-height:1.5;background:var(--void);color:var(--ink);border:1px solid var(--line);
  border-radius:2px;padding:10px;
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-family:var(--mono);font-size:11px;color:var(--moss)}
.note.bad{color:var(--rust)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

@media (max-width:760px){
  #main{flex-direction:column-reverse}
  #rail{width:auto;flex:0 0 auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-top:1px solid var(--line);padding:6px 10px}
  .group{display:none}
  .tool{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;
    padding:7px 10px}
  .tool[aria-pressed="true"]{border-left-color:transparent;border-bottom-color:var(--amber)}
  .tool .d{display:none}
  #stage{flex:1 1 auto;min-height:44vh}
  footer{gap:10px}
  .par{min-width:150px;flex:1 1 150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand">Biodome&nbsp;01 <span>Survey</span></div>
    <div class="counts" id="counts"></div>
    <div class="spacer"></div>
    <div class="acts">
      <button class="btn" id="bUndo">Undo</button>
      <button class="btn" id="bClear">Clear</button>
      <button class="btn" id="bFit">Fit</button>
      <button class="btn" id="bImport">Paste</button>
      <button class="btn key" id="bExport">Export JSON</button>
    </div>
  </header>

  <div id="main">
    <nav id="rail" aria-label="Tools"></nav>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="coord">—</div>
    </div>
  </div>

  <footer>
    <div class="par">
      <label for="pBrush">Brush</label>
      <input type="range" id="pBrush" min="1" max="26" step="1" value="6">
      <output id="oBrush">6 m</output>
    </div>
    <div class="par">
      <label for="pLevel">Level</label>
      <input type="range" id="pLevel" min="0" max="1" step="0.01" value="0.5">
      <output id="oLevel">0.50</output>
    </div>
    <div class="par">
      <label for="pCount">Spawns</label>
      <input type="range" id="pCount" min="1" max="12" step="1" value="3">
      <output id="oCount">3</output>
    </div>
  </footer>
</div>

<div id="sheet" hidden>
  <div class="card">
    <header>
      <div class="brand" id="sheetTitle">Export</div>
      <div class="spacer"></div>
      <button class="btn" id="bClose">Close</button>
    </header>
    <div class="body">
      <p id="sheetHelp"></p>
      <textarea id="ta" spellcheck="false" aria-label="Map edit JSON"></textarea>
      <div class="row">
        <button class="btn key" id="bCopy">Copy to clipboard</button>
        <button class="btn" id="bLoad" hidden>Load it</button>
        <span class="note" id="note"></span>
      </div>
    </div>
  </div>
</div>

/* ------------------------------------------------------------------ model
   A straight port of MapEdit.gd. Same six lists, same one-door-in `add` so
   nothing can be recorded without being undoable, same history of
   [list, index] pairs so undo takes back the LAST edit whatever kind it was.
   The JSON it emits has to be byte-for-byte acceptable to
   tools/apply_map_edit.gd, so the format string and the shapes are fixed. */
const FORMAT = "sentinel-map-edit", VERSION = 1;
const ED = {ops:[], blocked:[], walls:[], plants:[], roamers:[], nests:[], patches:[], hist:[]};
const listOf = k => ED[k];
function add(k, e){ listOf(k).push(e); ED.hist.push([k, listOf(k).length-1]); }
function undo(){
  const last = ED.hist.pop(); if(!last) return null;
  const arr = listOf(last[0]); if(last[1] >= arr.length) return null;
  const gone = arr.splice(last[1],1)[0];
  for(const h of ED.hist) if(h[0]===last[0] && h[1]>last[1]) h[1]--;
  return gone;
}
function clearAll(){ for(const k of ["ops","blocked","walls","plants","roamers","nests","patches"]) ED[k].length=0; ED.hist.length=0; }

/* A blocked disc becomes a POLYGON, not a plateau — same reason as in the
   Godot editor: a plateau op's cosine-squared falloff has only moved the
   ground a quarter of the way to its level at two thirds of the radius, so a
   nine-metre blocked disc left a walkable ring the designer drew and could
   not see. _polygon fills its interior at full strength. */
const BLOCK_SIDES = 20, BLOCK_EDGE = 1.5;
const impLevel = () => Math.max(0, M.impassable_below - 0.05);
function blockedOp(b){
  const pts = [];
  for(let i=0;i<BLOCK_SIDES;i++){
    const a = Math.PI*2*i/BLOCK_SIDES;
    pts.push([b.x + Math.cos(a)*Math.max(0.5,b.r), b.z + Math.sin(a)*Math.max(0.5,b.r)]);
  }
  return {op:"polygon", points:pts, level:impLevel(), edge:BLOCK_EDGE, strength:1.0};
}
function allOps(){
  const out = ED.ops.slice();
  for(const b of ED.blocked) out.push(blockedOp(b));
  for(const w of ED.walls) out.push({op:"wall", points:w.points});
  return out;
}
function toJSON(){
  return JSON.stringify({
    format:FORMAT, version:VERSION, map:M.map,
    notes:"Drawn in the browser survey editor.",
    ops:ED.ops, blocked:ED.blocked,
    walls:ED.walls.map(w=>({points:w.points.map(p=>[r1(p[0]),r1(p[1])])})),
    plants:ED.plants,
    hive:{roamers:ED.roamers, nests:ED.nests, patches:ED.patches}
  }, null, 2);
}
const r1 = v => Math.round(v*10)/10;

/* ------------------------------------------------------------- terrain data
   The PNG carries height in R, material in G, water in B, baked straight out
   of the same TerrainBuilder the game runs. `base` never changes; `work` is
   base plus every edit replayed, which is also how undo works — a hole cannot
   be un-dug in place. */
const W = M.cells_x, H = M.cells_z, CS = M.cell_size_m;
// `mat` is the material id the exporter packs into G. Decoded and not yet
// used: the colour here comes from height and water, which is enough to
// read the shape. It is kept so a future pass can tint moss against rock
// without re-baking the PNG.
let base=null, work=null, mat=null, wat=null, walled=null;

function applyOp(h, op){
  if(op.op === "crater"){
    // Heightfield.deform: f = cos(d/r * PI/2), h += amount * f*f, clamped.
    const gx=op.x/CS, gz=op.z/CS, gr=op.r/CS;
    const x0=Math.max(0,Math.floor(gx-gr)), x1=Math.min(W-1,Math.ceil(gx+gr));
    const z0=Math.max(0,Math.floor(gz-gr)), z1=Math.min(H-1,Math.ceil(gz+gr));
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){
      const d=Math.hypot(x-gx,z-gz); if(d>gr) continue;
      const f=Math.cos(d/gr*Math.PI*0.5), i=z*W+x;
      h[i]=Math.min(M.clamp_max, Math.max(Math.min(M.clamp_min,h[i]), h[i]+op.amount*f*f));
    }
  } else if(op.op === "plateau"){
    // TerrainBuilder._disc: lerp toward level by strength * f*f.
    const gr=op.r, st=op.strength==null?1:op.strength;
    const x0=Math.max(0,Math.floor(op.x-gr)), x1=Math.min(W-1,Math.ceil(op.x+gr));
    const z0=Math.max(0,Math.floor(op.z-gr)), z1=Math.min(H-1,Math.ceil(op.z+gr));
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){
      const d=Math.hypot(x-op.x,z-op.z); if(d>gr) continue;
      const f=Math.cos(d/gr*Math.PI*0.5), k=Math.min(1,Math.max(0,st*f*f)), i=z*W+x;
      h[i]=h[i]+(op.level-h[i])*k;
    }
  } else if(op.op === "polygon"){
    const pts=op.points.map(p=>Array.isArray(p)?p:[p.x,p.z]);
    let lo=[1e9,1e9], hi=[-1e9,-1e9];
    for(const p of pts){lo[0]=Math.min(lo[0],p[0]);lo[1]=Math.min(lo[1],p[1]);
      hi[0]=Math.max(hi[0],p[0]);hi[1]=Math.max(hi[1],p[1]);}
    const e=op.edge==null?4:op.edge, st=op.strength==null?1:op.strength;
    const x0=Math.max(0,Math.floor(lo[0]-e)), x1=Math.min(W-1,Math.ceil(hi[0]+e));
    const z0=Math.max(0,Math.floor(lo[1]-e)), z1=Math.min(H-1,Math.ceil(hi[1]+e));
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){
      const inside=ptIn(pts,x,z);
      const f = inside ? 1 : Math.max(0, 1 - distPoly(pts,x,z)/Math.max(0.001,e));
      if(f<=0) continue;
      const k=Math.min(1,Math.max(0,st*f*f)), i=z*W+x;
      h[i]=h[i]+(op.level-h[i])*k;
    }
  } else if(op.op === "wall"){
    const pts=op.points.map(p=>Array.isArray(p)?p:[p.x,p.z]);
    if(pts.length<3) return;
    let lo=[1e9,1e9], hi=[-1e9,-1e9];
    for(const p of pts){lo[0]=Math.min(lo[0],p[0]);lo[1]=Math.min(lo[1],p[1]);
      hi[0]=Math.max(hi[0],p[0]);hi[1]=Math.max(hi[1],p[1]);}
    const x0=Math.max(0,Math.floor(lo[0])), x1=Math.min(W-1,Math.ceil(hi[0]));
    const z0=Math.max(0,Math.floor(lo[1])), z1=Math.min(H-1,Math.ceil(hi[1]));
    // Cell CENTRES, like Heightfield.wall_polygon — testing the corner puts
    // the wall half a metre off and leaves a gap a swarmer walks through.
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++)
      if(ptIn(pts,x+0.5,z+0.5)) walled[z*W+x]=1;
  }
}
function ptIn(pts,x,y){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i], b=pts[j];
    if((a[1]>y)!==(b[1]>y) && x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) inside=!inside;
  }
  return inside;
}
function distPoly(pts,x,y){
  let best=1e9;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i], b=pts[j];
    const vx=b[0]-a[0], vy=b[1]-a[1], wx=x-a[0], wy=y-a[1];
    const L=vx*vx+vy*vy, t=L<=0?0:Math.min(1,Math.max(0,(wx*vx+wy*vy)/L));
    best=Math.min(best, Math.hypot(x-(a[0]+vx*t), y-(a[1]+vy*t)));
  }
  return best;
}
function rebuild(){
  work.set(base); walled.fill(0);
  for(const op of allOps()) applyOp(work, op);
  paint(); refresh();
}

/* ------------------------------------------------------------------ paint */
const tile = document.createElement("canvas");
tile.width=W; tile.height=H;
const tctx = tile.getContext("2d", {willReadFrequently:true});
let imgData=null;
const hex = s => [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];
const C_POOL=hex(M.colours.pool), C_ROUGH=hex(M.colours.rough),
      C_GROUND=hex(M.colours.ground), C_RIDGE=hex(M.colours.ridge);
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

function paint(){
  const d=imgData.data, imp=M.impassable_below, rgh=M.rough_below;
  for(let z=0;z<H;z++) for(let x=0;x<W;x++){
    const i=z*W+x, h=work[i];
    let c;
    if(h < imp){
      // Below the impassable line there is no ground — this is the chasm the
      // whole map's silhouette is made of, so it reads as the page ground.
      c=[10,15,17];
    }else if(h < rgh){
      c=mix(C_ROUGH, C_GROUND, (h-imp)/Math.max(.001,rgh-imp));
    }else{
      c=mix(C_GROUND, C_RIDGE, Math.min(1,(h-rgh)/Math.max(.001,1-rgh)));
    }
    if(wat[i] > 0.4) c=mix(c, C_POOL, Math.min(1, wat[i]));
    // Relief from the height gradient, lit from the same north-west the
    // game's moon sits in, so the shape of a plateau reads at a glance.
    const hl = work[z*W+Math.max(0,x-1)], hr = work[z*W+Math.min(W-1,x+1)];
    const hu = work[Math.max(0,z-1)*W+x], hd = work[Math.min(H-1,z+1)*W+x];
    // Relief, kept on a SHORT LEASH. At the first strength the gradient term
    // pushed most of the map past its ridge colour and the whole biodome
    // rendered as pale grey — a survey of somewhere else. The floor is dark
    // teal and it has to stay dark teal.
    const s = 1 + ((hl-hr)*0.9 + (hu-hd)*0.6) * 3.2;
    const k = Math.min(1.22, Math.max(0.6, s)) * 0.84;
    const o=i*4;
    d[o]=Math.min(255,c[0]*k); d[o+1]=Math.min(255,c[1]*k); d[o+2]=Math.min(255,c[2]*k);
    if(walled[i]){ d[o]=Math.min(255,d[o]*.72+70); d[o+1]=Math.min(255,d[o+1]*.72+52); d[o+2]=Math.min(255,d[o+2]*.72+14); }
    d[o+3]=255;
  }
  tctx.putImageData(imgData,0,0);
}

/* ------------------------------------------------------------------- view */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let view={s:5, x:0, y:0};      // pixels per metre, and the top-left in pixels
function fit(){
  const r=cv.getBoundingClientRect();
  view.s=Math.min(r.width/(W*CS), r.height/(H*CS))*0.94;
  view.x=(r.width-W*CS*view.s)/2; view.y=(r.height-H*CS*view.s)/2;
  draw();
}
const toScreen=(mx,mz)=>[view.x+mx*view.s, view.y+mz*view.s];
const toMap=(px,py)=>[(px-view.x)/view.s, (py-view.y)/view.s];

function resize(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function ring(mx,mz,rm,stroke,fill){
  const [px,py]=toScreen(mx,mz), rp=rm*view.s;
  ctx.beginPath(); ctx.arc(px,py,rp,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.25;ctx.stroke();}
}
function dot(mx,mz,rp,fill){
  const [px,py]=toScreen(mx,mz);
  ctx.beginPath(); ctx.arc(px,py,rp,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill();
}
function draw(){
  const r=cv.getBoundingClientRect();
  ctx.fillStyle="#080d0f"; ctx.fillRect(0,0,r.width,r.height);
  // Smooth when zoomed OUT, crisp past 12 px/m where the 1 m cells are the
  // thing being looked at.
  ctx.imageSmoothingEnabled = view.s < 12;
  ctx.drawImage(tile, view.x, view.y, W*CS*view.s, H*CS*view.s);

  // The props the dressing really scatters, so "next to that plant" means a
  // plant that is actually there.
  if(view.s > 2.2){
    for(const p of M.props){
      const big = p.k.indexOf("arch")>=0 || p.k.indexOf("spire")>=0 || p.k.indexOf("ruin")>=0;
      dot(p.x,p.z, Math.max(1, (big?1.5:0.8)*view.s*0.5),
        big ? "rgba(150,168,160,.55)" : "rgba(99,196,143,.42)");
    }
  }
  // Landing site.
  const sp=M.spawn;
  ring(sp[0],sp[1],11,"rgba(226,162,75,.5)",null);
  ctx.fillStyle="rgba(226,162,75,.85)"; ctx.font="600 11px "+getComputedStyle(document.body).fontFamily;
  const [lx,ly]=toScreen(sp[0],sp[1]); ctx.fillText("LANDING", lx+11*view.s+8, ly+4);

  for(const b of ED.blocked) ring(b.x,b.z,b.r,"rgba(222,91,78,.9)","rgba(222,91,78,.22)");
  for(const w of ED.walls) poly(w.points, "rgba(226,162,75,.95)", "rgba(226,162,75,.16)", true);
  if(pending.length) poly(pending, "rgba(87,201,222,.95)", null, false);

  for(const p of ED.plants) dot(p.x,p.z, Math.max(2.2, 0.9*view.s), "#63c48f");
  for(const rm of ED.roamers){
    ring(rm.x,rm.z, rm.wander_m, "rgba(232,129,60,.55)","rgba(232,129,60,.10)");
    dot(rm.x,rm.z, Math.max(3.5,1.5*view.s), "#e8813c");
  }
  for(const n of ED.nests){
    ring(n.x,n.z, M.hive.plant_notice_m, "rgba(210,90,158,.5)","rgba(210,90,158,.12)");
    dot(n.x,n.z, Math.max(3,1.2*view.s), "#d25a9e");
    tag(n.x,n.z, String(n.count), "#d25a9e");
  }
  for(const q of ED.patches){
    ring(q.x,q.z, M.hive.patch_notice_m, "rgba(87,201,222,.5)","rgba(87,201,222,.12)");
    dot(q.x,q.z, Math.max(2.6,1*view.s), "#57c9de");
    tag(q.x,q.z, String(q.count), "#57c9de");
  }
  // Brush footprint, so a 26 m brush is not a surprise.
  if(hoverM && ["raise","lower","flatten","plateau","block"].includes(tool)){
    ring(hoverM[0],hoverM[1], brush, "rgba(223,233,232,.55)", null);
  }
}
function poly(pts, stroke, fill, close){
  if(!pts.length) return;
  ctx.beginPath();
  pts.forEach((p,i)=>{ const [px,py]=toScreen(p[0],p[1]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
  if(close) ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  ctx.strokeStyle=stroke; ctx.lineWidth=1.75; ctx.stroke();
  for(const p of pts) dot(p[0],p[1], 3.2, stroke);
}
function tag(mx,mz,txt,col){
  const [px,py]=toScreen(mx,mz);
  ctx.font="500 11px "+"'IBM Plex Mono',monospace";
  ctx.fillStyle=col; ctx.fillText(txt, px+8, py-7);
}

/* ------------------------------------------------------------------ tools */
const TOOLS=[
  {id:"raise",   g:"Shape",  n:"Raise",   d:"drag to lift",      c:"#a3a79e"},
  {id:"lower",   g:"Shape",  n:"Lower",   d:"drag to dig",       c:"#5c6f6a"},
  {id:"flatten", g:"Shape",  n:"Flatten", d:"drag toward level", c:"#8a9a92"},
  {id:"plateau", g:"Shape",  n:"Plateau", d:"stamp a disc",      c:"#c9cec4"},
  {id:"block",   g:"No go",  n:"Block",   d:"carve a chasm",     c:"#de5b4e"},
  {id:"wall",    g:"No go",  n:"Wall",    d:"free-form, invisible", c:"#e2a24b"},
  {id:"plant",   g:"Place",  n:"Plant",   d:"vegetation",        c:"#63c48f"},
  {id:"roamer",  g:"Place",  n:"Roamer",  d:"big alien",         c:"#e8813c"},
  {id:"nest",    g:"Place",  n:"Nest",    d:"plant hive",        c:"#d25a9e"},
  {id:"patch",   g:"Place",  n:"Patch",   d:"burrow",            c:"#57c9de"},
  {id:"erase",   g:"Place",  n:"Erase",   d:"nearest placement", c:"#7c9398"},
];
const HINTS={
  raise:"<b>Drag</b> to lift the ground. Brush sets the radius.",
  lower:"<b>Drag</b> to dig. Deep enough and it becomes impassable.",
  flatten:"<b>Drag</b> to pull the ground toward the Level slider.",
  plateau:"<b>Tap</b> to stamp a disc at Level, full strength.",
  block:"<b>Tap</b> to carve a chasm. Use this when the obstacle IS the ground.",
  wall:"<b>Tap out corners</b>, then tap the first one again to close. Invisible in game, changes no ground — for thickets and structure clusters.",
  plant:"<b>Tap</b> to place vegetation.",
  roamer:"<b>Tap</b> to place a roaming creature. The ring is its territory.",
  nest:"<b>Tap</b> to place a plant hive. Spawns sets how many it sends.",
  patch:"<b>Tap</b> to place a burrow. Spawns sets how many come up, once.",
  erase:"<b>Tap</b> near a placement to remove it. Shape edits go through Undo.",
};
let tool="raise", brush=6, level=0.5, count=3, pending=[], hoverM=null;

const rail=document.getElementById("rail");
let lastGroup="";
for(const t of TOOLS){
  if(t.g!==lastGroup){ lastGroup=t.g;
    const g=document.createElement("div"); g.className="group"; g.textContent=t.g; rail.appendChild(g); }
  const b=document.createElement("button");
  b.className="tool"; b.type="button"; b.dataset.id=t.id;
  b.setAttribute("aria-pressed", String(t.id===tool));
  b.innerHTML='<i style="background:'+t.c+'"></i><span class="n">'+t.n+'<span class="d">'+t.d+'</span></span>';
  b.addEventListener("click", ()=>pick(t.id));
  rail.appendChild(b);
}
function pick(id){
  if(tool==="wall" && id!=="wall" && pending.length) pending=[];
  tool=id;
  rail.querySelectorAll(".tool").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.id===id)));
  document.getElementById("hint").innerHTML=HINTS[id];
  draw();
}

/* ------------------------------------------------------------------ edits */
function edit(mx,mz,continuous){
  const amt = 0.02 * Math.min(2, Math.max(0.5, brush/6));
  switch(tool){
    case "raise":   stamp({op:"crater", x:mx, z:mz, r:brush, amount:amt}); break;
    case "lower":   stamp({op:"crater", x:mx, z:mz, r:brush, amount:-amt}); break;
    case "flatten": stamp({op:"plateau", x:mx, z:mz, r:brush, level, strength: continuous?0.35:0.7}); break;
    case "plateau": if(continuous) return; stamp({op:"plateau", x:mx, z:mz, r:brush, level, strength:1}); break;
    case "block":   if(continuous) return; add("blocked",{x:r1(mx), z:r1(mz), r:brush}); rebuild(); break;
    case "wall":    if(continuous) return; wallTap(mx,mz); break;
    case "plant":   if(continuous) return; add("plants",{model:"flora_brain", x:r1(mx), z:r1(mz), yaw:Math.round(Math.random()*628)/100, scale:0.9}); refresh(); draw(); break;
    case "roamer":  if(continuous) return; add("roamers",{x:r1(mx), z:r1(mz), wander_m:M.hive.roamer_wander_m}); refresh(); draw(); break;
    case "nest":    if(continuous) return; add("nests",{x:r1(mx), z:r1(mz), count, interval_s:7.0}); refresh(); draw(); break;
    case "patch":   if(continuous) return; add("patches",{x:r1(mx), z:r1(mz), count}); refresh(); draw(); break;
    case "erase":   if(continuous) return; eraseNear(mx,mz); break;
  }
}
function stamp(op){ op.x=r1(op.x); op.z=r1(op.z); add("ops",op); applyOp(work,op); paint(); refresh(); draw(); }
function wallTap(mx,mz){
  if(pending.length>=3){
    const f=pending[0];
    if(Math.hypot(mx-f[0],mz-f[1]) <= Math.max(3, brush*0.5)) return closeWall();
  }
  pending.push([r1(mx),r1(mz)]); draw(); refresh();
}
function closeWall(){
  if(pending.length<3){ flash("A wall needs at least three corners.", true); return; }
  if(Math.abs(area(pending)) < 1){ flash("That wall encloses nothing.", true); return; }
  add("walls",{points:pending.slice()}); pending=[]; rebuild();
}
const area = p => { let a=0; for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length]; a+=p[i][0]*q[1]-q[0]*p[i][1];} return a/2; };
function eraseNear(mx,mz){
  let best=null, bd=9;
  for(const k of ["plants","roamers","nests","patches","blocked"])
    ED[k].forEach((e,i)=>{ const d=Math.hypot(e.x-mx,e.z-mz); if(d<bd){bd=d;best=[k,i];} });
  if(!best){ flash("Nothing within 9 m to erase.", true); return; }
  const [k,i]=best; ED[k].splice(i,1);
  for(const h of ED.hist){ if(h[0]===k && h[1]>i) h[1]--; else if(h[0]===k && h[1]===i) h[1]=-1; }
  if(k==="blocked") rebuild(); else { refresh(); draw(); }
}

/* ------------------------------------------------------------------ input */
const pts=new Map(); let dragging=false, panned=false, pressAt=null, pinch0=0, pinchS=0;
cv.addEventListener("pointerdown", e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){ dragging=false; panned=true; pinch0=spread(); pinchS=view.s; return; }
  dragging=true; panned=false; pressAt=[e.clientX,e.clientY];
});
cv.addEventListener("pointermove", e=>{
  const r=cv.getBoundingClientRect();
  hoverM=toMap(e.clientX-r.left, e.clientY-r.top);
  document.getElementById("coord").textContent =
    hoverM[0]>=0&&hoverM[0]<=W*CS&&hoverM[1]>=0&&hoverM[1]<=H*CS
      ? hoverM[0].toFixed(1)+", "+hoverM[1].toFixed(1)+" m   h "+
        work[Math.min(H-1,Math.max(0,Math.floor(hoverM[1])))*W+Math.min(W-1,Math.max(0,Math.floor(hoverM[0])))].toFixed(2)
      : "—";
  if(!pts.has(e.pointerId)){ draw(); return; }
  const prev=pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>=2){ doPinch(); return; }
  if(!dragging) return;
  if(Math.hypot(e.clientX-pressAt[0], e.clientY-pressAt[1])>10) panned=true;
  const paints=["raise","lower","flatten"].includes(tool);
  if(panned && paints){ edit(hoverM[0],hoverM[1],true); return; }
  if(panned){ view.x+=e.clientX-prev[0]; view.y+=e.clientY-prev[1]; draw(); }
});
function endPointer(e){
  const had=pts.has(e.pointerId); pts.delete(e.pointerId);
  if(pts.size===0){
    if(had && dragging && !panned){
      const r=cv.getBoundingClientRect();
      const m=toMap(e.clientX-r.left, e.clientY-r.top);
      if(m[0]>=0&&m[0]<=W*CS&&m[1]>=0&&m[1]<=H*CS) edit(m[0],m[1],false);
    }
    dragging=false; panned=false;
  }else if(pts.size===1){ dragging=false; panned=true; }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", ()=>{hoverM=null; document.getElementById("coord").textContent="—"; draw();});
function spread(){ const v=[...pts.values()]; return Math.hypot(v[0][0]-v[1][0], v[0][1]-v[1][1]); }
function doPinch(){
  const now=spread(); if(pinch0<24||now<24) return;
  const v=[...pts.values()], r=cv.getBoundingClientRect();
  const cx=(v[0][0]+v[1][0])/2-r.left, cy=(v[0][1]+v[1][1])/2-r.top;
  zoomAt(cx, cy, pinchS*(now/pinch0)/view.s);
}
cv.addEventListener("wheel", e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:1/1.12);
},{passive:false});
function zoomAt(cx,cy,k){
  const before=toMap(cx,cy);
  view.s=Math.min(40, Math.max(1.2, view.s*k));
  const after=toMap(cx,cy);
  view.x+=(after[0]-before[0])*view.s; view.y+=(after[1]-before[1])*view.s;
  draw();
}

/* ------------------------------------------------------------------- chrome */
function refresh(){
  const C=[["Shape",ED.ops.length,"#c9cec4"],["Blocked",ED.blocked.length,"#de5b4e"],
    ["Walls",ED.walls.length,"#e2a24b"],["Plants",ED.plants.length,"#63c48f"],
    ["Roaming",ED.roamers.length,"#e8813c"],["Nests",ED.nests.length,"#d25a9e"],
    ["Patches",ED.patches.length,"#57c9de"]];
  document.getElementById("counts").innerHTML = C.map(([n,v,c])=>
    '<span class="chip"><i style="background:'+c+'"></i>'+n+' <b>'+v+'</b></span>').join("")
    + (pending.length ? '<span class="chip" style="border-color:#57c9de"><i style="background:#57c9de"></i>Wall open <b>'+pending.length+'</b></span>' : "");
}
function flash(msg, bad){
  const n=document.getElementById("note");
  n.textContent=msg; n.className="note"+(bad?" bad":"");
  clearTimeout(flash._t); flash._t=setTimeout(()=>{n.textContent="";},3200);
  if(document.getElementById("sheet").hidden){
    const h=document.getElementById("hint");
    h.innerHTML="<b>"+msg+"</b>"; setTimeout(()=>{h.innerHTML=HINTS[tool];},3200);
  }
}
const sheet=document.getElementById("sheet"), ta=document.getElementById("ta");
function openSheet(mode){
  sheet.hidden=false;
  const isExp = mode==="export";
  document.getElementById("sheetTitle").textContent = isExp ? "Export" : "Paste an edit";
  document.getElementById("sheetHelp").innerHTML = isExp
    ? "Copy this and paste it into the chat. Ask me to <b>apply it</b> and it goes through <b>tools/apply_map_edit.gd</b>, which validates every entry and refuses the whole file rather than half-applying it."
    : "Paste a <b>sentinel-map-edit</b> JSON here to carry on working on it.";
  document.getElementById("bCopy").hidden=!isExp;
  document.getElementById("bLoad").hidden=isExp;
  ta.value = isExp ? toJSON() : "";
  ta.readOnly = isExp;
  if(!isExp) ta.focus();
}
document.getElementById("bExport").addEventListener("click",()=>openSheet("export"));
document.getElementById("bImport").addEventListener("click",()=>openSheet("import"));
document.getElementById("bClose").addEventListener("click",()=>{sheet.hidden=true;});
sheet.addEventListener("click", e=>{ if(e.target===sheet) sheet.hidden=true; });
document.getElementById("bCopy").addEventListener("click", async ()=>{
  try{ await navigator.clipboard.writeText(ta.value); flash("Copied — "+ta.value.length+" characters."); }
  catch(_){ ta.select(); flash("Select-all is done; press copy on your keyboard.", true); }
});
document.getElementById("bLoad").addEventListener("click", ()=>{
  let d; try{ d=JSON.parse(ta.value); }catch(_){ return flash("That is not JSON.", true); }
  if(!d || d.format!==FORMAT) return flash("Not a "+FORMAT+" file.", true);
  if((d.version|0) > VERSION) return flash("Made by a newer editor.", true);
  clearAll(); pending=[];
  const h=d.hive||{};
  const feed=[["ops",d.ops],["blocked",d.blocked],["walls",d.walls],["plants",d.plants],
    ["roamers",h.roamers],["nests",h.nests],["patches",h.patches]];
  for(const [k,arr] of feed) for(const e of (arr||[])){
    if(k==="walls"){ const p=(e.points||[]).map(q=>Array.isArray(q)?[+q[0],+q[1]]:[+q.x,+(q.z??q.y)]);
      if(p.length>=3) add(k,{points:p}); }
    else add(k,e);
  }
  sheet.hidden=true; rebuild(); flash("Loaded.");
});
document.getElementById("bUndo").addEventListener("click", ()=>{
  if(pending.length){ pending.pop(); draw(); refresh(); return; }
  if(!undo()) return flash("Nothing to undo.", true);
  rebuild();
});
document.getElementById("bClear").addEventListener("click", ()=>{
  clearAll(); pending=[]; rebuild(); flash("Cleared.");
});
document.getElementById("bFit").addEventListener("click", fit);
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(!sheet.hidden) sheet.hidden=true; else if(pending.length){pending=[];draw();refresh();} }
  if(e.key==="Enter" && pending.length>=3 && sheet.hidden) closeWall();
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); document.getElementById("bUndo").click(); }
});
function bindPar(id,out,fmt,set){
  const el=document.getElementById(id), o=document.getElementById(out);
  const upd=()=>{ set(parseFloat(el.value)); o.textContent=fmt(parseFloat(el.value)); draw(); };
  el.addEventListener("input",upd); upd();
}

/* -------------------------------------------------------------------- boot */
const im=new Image();
im.onload=()=>{
  tctx.drawImage(im,0,0);
  const src=tctx.getImageData(0,0,W,H).data;
  base=new Float32Array(W*H); work=new Float32Array(W*H);
  mat=new Uint8Array(W*H); wat=new Float32Array(W*H); walled=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){
    base[i]=src[i*4]/255; mat[i]=Math.round(src[i*4+1]/255*8); wat[i]=src[i*4+2]/255;
  }
  imgData=tctx.createImageData(W,H);
  // Anything already applied to the map ships in `placed`, so the page opens
  // on the real current layout rather than on an empty one.
  if(M.placed){
    for(const p of (M.placed.roamers||[])) add("roamers",{x:p[0],z:p[1],wander_m:M.hive.roamer_wander_m});
    for(const p of (M.placed.nests||[])) add("nests",{x:p[0],z:p[1],count:M.hive.plant_brood_count,interval_s:7.0});
    for(const p of (M.placed.patches||[])) add("patches",{x:p[0],z:p[1],count:3});
    ED.hist.length=0;   // the existing layout is not the designer's to undo
  }
  bindPar("pBrush","oBrush",v=>v.toFixed(0)+" m",v=>brush=v);
  bindPar("pLevel","oLevel",v=>v.toFixed(2),v=>level=v);
  bindPar("pCount","oCount",v=>v.toFixed(0),v=>count=v);
  pick("raise");
  work.set(base); paint(); refresh();
  resize(); fit();
  window.addEventListener("resize", ()=>{resize(); });
  if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(document.getElementById("stage"));
};
im.src=MAP_PNG;
</script>
